<!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Habit Tracker & Daily Schedule Wheels</title>
<style>
  :root { --ink:#2b2d3a; --tint:#f4f5f9; --line:#2b2d3a; --soft:#c9ccd8; }
  * { box-sizing: border-box; }
  html { background:#e6e8ee; }
  body { margin:0; padding:60px 12px 60px; font-family:"Vazirmatn","Tahoma","Segoe UI",system-ui,sans-serif; color:var(--ink); }
  .bar { position:fixed; top:0; left:0; right:0; z-index:10; display:flex; gap:8px; padding:10px 12px; background:#e6e8ee; align-items:center; flex-wrap:wrap; }
  .bar button { font:inherit; font-size:14px; padding:8px 14px; color:var(--ink); background:#fff; border:1.5px solid var(--ink); border-radius:6px; cursor:pointer; }
  .bar button:hover { background:var(--tint); }
  .bar button.armed { background:var(--ink); color:#fff; }
  .bar button:focus-visible, .m:focus-visible { outline:3px solid #6b7cff; outline-offset:2px; }
  #sync { font-size:12px; margin-inline-start:auto; color:#4a4d5e; }
  .page { width:min(297mm,100%); min-height:210mm; margin:0 auto 24px; padding:12mm 14mm; background:#fff; box-shadow:0 2px 14px rgba(43,45,58,.18); display:flex; flex-direction:column; }
  h1 { margin:0 0 5mm; text-align:center; font-size:20px; font-weight:700; letter-spacing:.45em; }
  h1.plain { letter-spacing:.02em; font-size:22px; }
  .yr { display:flex; align-items:center; justify-content:center; gap:14px; margin-bottom:3mm; font-weight:700; font-size:16px; }
  .yr button { font:inherit; border:1.5px solid var(--ink); background:#fff; border-radius:6px; width:32px; height:30px; cursor:pointer; }
  .months { display:grid; grid-template-columns:repeat(6,1fr); gap:5px; margin-bottom:5mm; }
  .m { text-align:center; padding:3px 4px; font-size:13px; border:1.5px solid var(--soft); border-radius:10px; cursor:pointer; user-select:none; line-height:1.3; }
  .m small { display:block; font-size:10px; color:#6a6d7e; letter-spacing:.05em; }
  .m:hover { border-color:var(--ink); }
  .m.on { border-color:var(--ink); background:var(--ink); color:#fff; font-weight:700; }
  .m.on small { color:#d8dae6; }
  .m.has::after { content:"●"; font-size:7px; margin-inline-start:4px; vertical-align:middle; }
  .grid-wrap { overflow-x:auto; }
  table.tracker { width:100%; min-width:900px; border-collapse:collapse; table-layout:fixed; }
  .tracker th,.tracker td { border:1px solid var(--line); height:7.4mm; padding:0; text-align:center; font-size:11px; }
  .tracker th { background:var(--tint); font-weight:700; }
  .tracker col.habit-col { width:24%; }
  .tracker td.habit { text-align:start; padding:0 6px; font-size:12.5px; overflow:hidden; white-space:nowrap; outline:none; }
  .tracker td.habit:focus { background:var(--tint); }
  .tracker td.c { cursor:pointer; font-size:14px; font-weight:700; user-select:none; }
  .tracker td.c:hover { background:var(--tint); }
  .tracker td.c.done { background:var(--ink); color:#fff; }
  .tracker td.c.off { background:repeating-linear-gradient(45deg,#fff,#fff 3px,#e3e5ec 3px,#e3e5ec 5px); cursor:default; }
  .tracker td.c:focus-visible { outline:3px solid #6b7cff; outline-offset:-3px; }
  .quote { margin-top:auto; padding-top:4mm; text-align:center; font-style:italic; font-size:13px; color:#4a4d5e; }

  .review { display:grid; grid-template-columns:1fr 1fr; gap:10mm; margin-top:4mm; }
  .review h2 { font-size:15px; margin:0 0 3mm; }
  .rrow { display:flex; align-items:center; gap:8px; margin-bottom:6px; font-size:13px; }
  .rrow .nm { flex:0 0 38%; overflow:hidden; white-space:nowrap; text-overflow:ellipsis; }
  .rrow .track { flex:1; height:12px; background:var(--tint); border:1px solid var(--line); border-radius:6px; overflow:hidden; }
  .rrow .fill { height:100%; background:var(--ink); }
  .rrow .pc { flex:0 0 74px; font-size:12px; text-align:end; }
  .rrow.hist { cursor:pointer; } .rrow.hist:hover .nm { text-decoration:underline; }
  .empty { color:#6a6d7e; font-size:13px; }

  .wheels { display:flex; flex:1; justify-content:space-around; align-items:center; gap:10px; flex-wrap:wrap; }
  .wheel { text-align:center; flex:1 1 320px; max-width:135mm; }
  .wheel svg { width:100%; height:auto; display:block; }
  .wheel .cap { font-weight:700; font-size:14px; margin-top:2mm; }
  .wedge { fill:var(--tint); stroke:var(--line); stroke-width:1.4; cursor:text; }
  .rim { fill:none; stroke:var(--line); stroke-width:2.6; pointer-events:none; }
  .hr { font-size:11.5px; fill:var(--ink); text-anchor:middle; dominant-baseline:middle; pointer-events:none; font-family:inherit; }
  .slot { width:100%; height:100%; display:flex; align-items:center; justify-content:center; text-align:center; font-size:10.5px; line-height:1.3; overflow:hidden; word-break:break-word; outline:none; color:var(--ink); }
  .slot:focus { background:rgba(255,255,255,.85); border-radius:4px; }

  @page { size:A4 landscape; margin:0; }
  @media print {
    html,body { background:#fff; padding:0; }
    .bar { display:none; }
    .page { width:297mm; height:210mm; min-height:0; margin:0; box-shadow:none; page-break-after:always; break-after:page; overflow:hidden; }
    .page:last-of-type { page-break-after:auto; break-after:auto; }
    .grid-wrap { overflow:visible; } table.tracker { min-width:0; }
  }
</style>
</head>
<body>

<div class="bar">
  <button id="calBtn" type="button"></button>
  <button id="todayBtn" type="button">این ماه</button>
  <button id="resetBtn" type="button">پاک کردن این ماه</button>
  <span id="sync"></span>
</div>

<section class="page" id="page1">
  <h1>HABIT TRACKER</h1>
  <div class="yr"><button id="yPrev" type="button" aria-label="سال قبل">›</button><span id="yLabel"></span><button id="yNext" type="button" aria-label="سال بعد">‹</button></div>
  <div class="months" id="months"></div>
  <div class="grid-wrap"><table class="tracker" id="tracker"></table></div>
  <div class="quote">“Good habits are worth being fanatical about.” — John Irving</div>
</section>

<section class="page" id="page2">
  <h1 class="plain" id="revTitle">مرور ماه</h1>
  <div class="review">
    <div><h2>پیشرفت هر عادت در این ماه</h2><div id="revHabits"></div></div>
    <div><h2>تاریخچه ماه‌ها (برای باز کردن کلیک کن)</h2><div id="revHist"></div></div>
  </div>
</section>

<section class="page" id="page3">
  <h1 class="plain">Daily Schedule Wheel</h1>
  <div class="wheels">
    <div class="wheel"><svg id="wheelAM" viewBox="0 0 420 420"></svg><div class="cap">A.M.  (00:00 – 12:00)</div></div>
    <div class="wheel"><svg id="wheelPM" viewBox="0 0 420 420"></svg><div class="cap">P.M.  (12:00 – 24:00)</div></div>
  </div>
</section>

<script>
(function () {
  /* ================= Supabase (اختیاری) =================
     بعد از ساخت پروژه، این دو مقدار را پر کن. تا خالی باشند، همه‌چیز فقط در مرورگر ذخیره می‌شود. */
  var SUPABASE_URL = 'https://xxiwgaihipxnkrxxfzxh.supabase.co';        // مثال: https://xxxx.supabase.co
  var SUPABASE_KEY = 'sb_publishable_9gCJnoX-yWSJY8qF2CqtZg_HfdZFvZ_';        // anon public key
  var TABLE = 'habit_months';   // ستون‌ها: id text (کلید اصلی), data jsonb, updated_at timestamptz

  var KEY = 'habit-tracker-v2';
  var G = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEPT','OCT','NOV','DEC'];
  var J = ['فروردین','اردیبهشت','خرداد','تیر','مرداد','شهریور','مهر','آبان','آذر','دی','بهمن','اسفند'];
  var G_FA = ['دی–بهمن','بهمن–اسفند','اسفند–فروردین','فروردین–اردیبهشت','اردیبهشت–خرداد','خرداد–تیر','تیر–مرداد','مرداد–شهریور','شهریور–مهر','مهر–آبان','آبان–آذر','آذر–دی'];
  var J_EN = ['MAR–APR','APR–MAY','MAY–JUN','JUN–JUL','JUL–AUG','AUG–SEP','SEP–OCT','OCT–NOV','NOV–DEC','DEC–JAN','JAN–FEB','FEB–MAR'];
  var ROWS = 14, DAYS = 31;

  function today() {
    var p = {};
    new Intl.DateTimeFormat('en-u-ca-persian-nu-latn', {year:'numeric', month:'numeric'}).formatToParts(new Date())
      .forEach(function (x) { p[x.type] = +x.value; });
    var d = new Date();
    return { j:{y:p.year, m:p.month-1}, g:{y:d.getFullYear(), m:d.getMonth()} };
  }
  function fresh() { var t = today(); return { mode:'j', y:t.j.y, m:t.j.m, months:{}, wheel:{} }; }

  var state = fresh(), dirty = {};
  try { var raw = localStorage.getItem(KEY); if (raw) state = Object.assign(fresh(), JSON.parse(raw)); } catch (e) {}

  function fa(n) { return state.mode === 'j' ? String(n).replace(/\d/g, function (d) { return '۰۱۲۳۴۵۶۷۸۹'[d]; }) : String(n); }
  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function keyOf(mode, y, m) { return mode + '-' + y + '-' + pad(m + 1); }
  function curKey() { return keyOf(state.mode, state.y, state.m); }
  function daysIn(mode, y, m) {
    if (mode === 'g') return new Date(y, m + 1, 0).getDate();
    if (m < 6) return 31; if (m < 11) return 30;
    return ((25 * y + 11) % 33 < 8) ? 30 : 29;
  }

  function monthData(create) {
    var k = curKey();
    if (!state.months[k] && create) {
      // ماه جدید: اسم عادت‌های آخرین ماه قبلی کپی می‌شود (تیک‌ها خالی)
      var prev = Object.keys(state.months).filter(function (x) { return x.charAt(0) === state.mode && x < k; }).sort().pop();
      state.months[k] = { habits: prev ? state.months[prev].habits.slice() : [], checks: {} };
    }
    return state.months[k] || { habits: [], checks: {} };
  }

  /* ---------- ذخیره‌سازی ---------- */
  var syncEl = document.getElementById('sync'), saveTimer = null;
  function setSync(t) { syncEl.textContent = t; }
  function save(k) {
    try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {}
    if (!SUPABASE_URL) return;
    dirty[k || 'wheel'] = 1; setSync('…در حال ذخیره');
    clearTimeout(saveTimer); saveTimer = setTimeout(push, 800);
  }
  function api(path, opts) {
    opts = opts || {}; opts.headers = Object.assign({ apikey:SUPABASE_KEY, Authorization:'Bearer '+SUPABASE_KEY, 'Content-Type':'application/json' }, opts.headers || {});
    return fetch(SUPABASE_URL + '/rest/v1/' + path, opts);
  }
  function push() {
    var ids = Object.keys(dirty); dirty = {};
    var rows = ids.map(function (id) { return { id:id, data: id === 'wheel' ? state.wheel : state.months[id] || null, updated_at:new Date().toISOString() }; });
    api(TABLE, { method:'POST', headers:{ Prefer:'resolution=merge-duplicates' }, body:JSON.stringify(rows) })
      .then(function (r) { setSync(r.ok ? 'ذخیره شد ✓' : 'خطا در ذخیره'); })
      .catch(function () { setSync('آفلاین — فقط در مرورگر ذخیره شد'); });
  }
  function pull() {
    if (!SUPABASE_URL) { setSync('ذخیره محلی (Supabase وصل نیست)'); return; }
    api(TABLE + '?select=id,data').then(function (r) { return r.json(); }).then(function (rows) {
      rows.forEach(function (r) { if (r.id === 'wheel') state.wheel = r.data || {}; else if (r.data) state.months[r.id] = r.data; });
      setSync('همگام شد ✓'); renderAll();
    }).catch(function () { setSync('آفلاین — فقط در مرورگر ذخیره شد'); });
  }

  /* ---------- انتخاب ماه ---------- */
  function renderMonths() {
    document.getElementById('calBtn').textContent = state.mode === 'j' ? 'تغییر به میلادی' : 'تغییر به شمسی';
    document.getElementById('yLabel').textContent = fa(state.y) + (state.mode === 'j' ? ' شمسی' : ' Gregorian');
    var box = document.getElementById('months'); box.innerHTML = '';
    (state.mode === 'j' ? J : G).forEach(function (name, i) {
      var d = document.createElement('div');
      var k = keyOf(state.mode, state.y, i), md = state.months[k];
      var has = md && Object.keys(md.checks).length;
      d.className = 'm' + (state.m === i ? ' on' : '') + (has ? ' has' : '');
      d.innerHTML = name + '<small>' + (state.mode === 'j' ? J_EN[i] : G_FA[i]) + '</small>';
      d.tabIndex = 0; d.setAttribute('role', 'radio'); d.setAttribute('aria-checked', state.m === i);
      function pick() { state.m = i; save(); renderAll(); }
      d.addEventListener('click', pick);
      d.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); pick(); } });
      box.appendChild(d);
    });
  }

  /* ---------- جدول عادت‌ها ---------- */
  function renderTracker() {
    var md = monthData(false), n = daysIn(state.mode, state.y, state.m), k = curKey();
    var t = document.getElementById('tracker'); t.innerHTML = '';
    var cg = document.createElement('colgroup'), c0 = document.createElement('col'); c0.className = 'habit-col'; cg.appendChild(c0);
    for (var d = 0; d < DAYS; d++) cg.appendChild(document.createElement('col'));
    t.appendChild(cg);

    var dr = document.createElement('tr'), bl = document.createElement('th');
    bl.style.cssText = 'background:#fff;border-top:0;border-left:0'; dr.appendChild(bl);
    var dt = document.createElement('th'); dt.colSpan = DAYS; dt.textContent = (state.mode === 'j' ? J : G)[state.m] + ' ' + fa(state.y); dt.style.letterSpacing = '.15em'; dr.appendChild(dt);
    t.appendChild(dr);

    var head = document.createElement('tr'), th0 = document.createElement('th'); th0.textContent = 'HABIT'; head.appendChild(th0);
    for (var i = 1; i <= DAYS; i++) { var th = document.createElement('th'); th.textContent = fa(i); head.appendChild(th); }
    t.appendChild(head);

    for (var r = 0; r < ROWS; r++) (function (r) {
      var tr = document.createElement('tr'), name = document.createElement('td');
      name.className = 'habit'; name.contentEditable = 'true'; name.setAttribute('dir', 'auto');
      name.textContent = md.habits[r] || '';
      name.addEventListener('input', function () { var m = monthData(true); m.habits[r] = name.textContent; save(k); });
      name.addEventListener('blur', renderReview);
      name.addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); name.blur(); } });
      tr.appendChild(name);
      for (var c = 0; c < DAYS; c++) (function (c) {
        var td = document.createElement('td'), ck = r + '-' + c;
        if (c >= n) { td.className = 'c off'; tr.appendChild(td); return; }
        function paint() { var on = (monthData(false).checks[ck]); td.className = 'c' + (on ? ' done' : ''); td.textContent = on ? '✓' : ''; }
        paint(); td.tabIndex = 0;
        function toggle() {
          var m = monthData(true);
          if (m.checks[ck]) delete m.checks[ck]; else m.checks[ck] = 1;
          paint(); save(k); renderReview(); renderMonths();
        }
        td.addEventListener('click', toggle);
        td.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggle(); } });
        tr.appendChild(td);
      })(c);
      t.appendChild(tr);
    })(r);
  }

  /* ---------- مرور و تاریخچه ---------- */
  function row(label, done, total, cls) {
    var p = total ? Math.round(done / total * 100) : 0, d = document.createElement('div');
    d.className = 'rrow ' + (cls || '');
    d.innerHTML = '<span class="nm"></span><span class="track"><span class="fill" style="display:block;width:' + p + '%"></span></span><span class="pc">' + fa(done) + '/' + fa(total) + ' · ' + fa(p) + '٪</span>';
    d.firstChild.textContent = label; return d;
  }
  function renderReview() {
    var md = monthData(false), n = daysIn(state.mode, state.y, state.m);
    document.getElementById('revTitle').textContent = 'مرور ماه: ' + (state.mode === 'j' ? J : G)[state.m] + ' ' + fa(state.y);
    var h = document.getElementById('revHabits'); h.innerHTML = '';
    var any = false;
    for (var r = 0; r < ROWS; r++) {
      var nm = (md.habits[r] || '').trim(); if (!nm) continue; any = true;
      var cnt = 0; for (var c = 0; c < n; c++) if (md.checks[r + '-' + c]) cnt++;
      h.appendChild(row(nm, cnt, n));
    }
    if (!any) h.innerHTML = '<div class="empty">هنوز عادتی برای این ماه ننوشتی.</div>';

    var hist = document.getElementById('revHist'); hist.innerHTML = '';
    var keys = Object.keys(state.months).filter(function (x) { return x.charAt(0) === state.mode; }).sort().reverse();
    var shown = 0;
    keys.forEach(function (k) {
      var p = k.split('-'), y = +p[1], m = +p[2] - 1, d = state.months[k];
      var named = d.habits.filter(function (x) { return x && x.trim(); }).length, tot = named * daysIn(state.mode, y, m);
      var done = Object.keys(d.checks).length; if (!done) return; shown++;
      var rw = row((state.mode === 'j' ? J : G)[m] + ' ' + fa(y), done, tot, 'hist');
      rw.addEventListener('click', function () { state.y = y; state.m = m; save(); renderAll(); window.scrollTo(0, 0); });
      hist.appendChild(rw);
    });
    if (!shown) hist.innerHTML = '<div class="empty">وقتی ماهی تیک بخورد، اینجا نشان داده می‌شود.</div>';
  }

  /* ---------- چرخ‌های برنامه ---------- */
  var NS = 'http://www.w3.org/2000/svg', CX = 210, CY = 210, R = 165;
  function pt(r, deg) { var a = (deg - 90) * Math.PI / 180; return [CX + r * Math.cos(a), CY + r * Math.sin(a)]; }
  function el(name, attrs) { var e = document.createElementNS(NS, name); for (var k in attrs) e.setAttribute(k, attrs[k]); return e; }
  function renderWheel(id, prefix, startHour) {
    var svg = document.getElementById(id); svg.innerHTML = '';
    for (var i = 0; i < 12; i++) (function (i) {
      var p1 = pt(R, i * 30), p2 = pt(R, (i + 1) * 30);
      var path = el('path', { 'class':'wedge', d:'M'+CX+','+CY+' L'+p1[0]+','+p1[1]+' A'+R+','+R+' 0 0 1 '+p2[0]+','+p2[1]+' Z' });
      svg.appendChild(path);
      var mid = pt(118, i * 30 + 15), fo = el('foreignObject', { x:mid[0]-30, y:mid[1]-28, width:60, height:56 });
      var slot = document.createElement('div'); slot.className = 'slot'; slot.contentEditable = 'true'; slot.setAttribute('dir', 'auto');
      var key = prefix + '-' + i; slot.textContent = state.wheel[key] || '';
      slot.addEventListener('input', function () { state.wheel[key] = slot.textContent; save('wheel'); });
      fo.appendChild(slot); path.addEventListener('click', function () { slot.focus(); }); svg.appendChild(fo);
    })(i);
    svg.appendChild(el('circle', { 'class':'rim', cx:CX, cy:CY, r:R }));
    for (var k = 0; k < 12; k++) {
      var p = pt(R + 22, k * 30), label = startHour + k; if (label === 0) label = 24;
      var tx = el('text', { 'class':'hr', x:p[0], y:p[1] }); tx.textContent = label; svg.appendChild(tx);
    }
  }

  function renderAll() { renderMonths(); renderTracker(); renderReview(); renderWheel('wheelAM','am',0); renderWheel('wheelPM','pm',12); }

  /* ---------- دکمه‌ها ---------- */
  document.getElementById('calBtn').addEventListener('click', function () {
    var t = today(), to = state.mode === 'j' ? 'g' : 'j';
    state.mode = to; state.y = t[to].y; state.m = t[to].m; save(); renderAll();
  });
  document.getElementById('todayBtn').addEventListener('click', function () { var t = today()[state.mode]; state.y = t.y; state.m = t.m; save(); renderAll(); });
  document.getElementById('yPrev').addEventListener('click', function () { state.y--; save(); renderAll(); });
  document.getElementById('yNext').addEventListener('click', function () { state.y++; save(); renderAll(); });

  var btn = document.getElementById('resetBtn'), idle = btn.textContent, armTimer = null;
  function disarm() { btn.classList.remove('armed'); btn.textContent = idle; clearTimeout(armTimer); armTimer = null; }
  btn.addEventListener('click', function () {
    if (!armTimer) { btn.classList.add('armed'); btn.textContent = 'مطمئنی؟ دوباره بزن'; armTimer = setTimeout(disarm, 4000); return; }
    var k = curKey(); delete state.months[k]; save(k);
    if (SUPABASE_URL) api(TABLE + '?id=eq.' + encodeURIComponent(k), { method:'DELETE' });
    renderAll(); disarm();
  });

  renderAll(); pull();
})();
</script>
</body>
</html>
